# generated by: yake code github-release-please
name: release-please
on:
  push:
    branches:
      - main
permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
jobs:
  release-please:
    name: Creating release
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}
  goreleaser:
    name: Build and release packages
    runs-on: ubuntu-latest
    needs:
      - release-please
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: "0"
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Test GoReleaser
        if: ${{ needs.release-please.outputs.release_created != 'true' }}
        uses: goreleaser/goreleaser-action@v7
        with:
          args: release --clean --snapshot
          distribution: goreleaser
          version: ~> v2
      - name: Run GoReleaser
        if: ${{ needs.release-please.outputs.release_created }}
        uses: goreleaser/goreleaser-action@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        with:
          args: release --clean
          distribution: goreleaser
          version: ~> v2
      - name: Check artifact uploader secret
        id: check-uploader
        run: if [ -n "$UPLOAD_URL" ]; then echo "available=true" >> "$GITHUB_OUTPUT"; fi
        env:
          UPLOAD_URL: ${{ secrets.ARTIFACT_UPLOADER_URL }}
      - name: Upload snapshot artifacts
        if: ${{ needs.release-please.outputs.release_created != 'true' && steps.check-uploader.outputs.available == 'true' }}
        env:
          UPLOAD_URL: ${{ secrets.ARTIFACT_UPLOADER_URL }}
        run: |
          TOKEN=$(curl -sSf  -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r '.value')
          for f in $(jq -r '.[] | select(.type=="Binary" or .type=="Linux Package") | .path' dist/artifacts.json); do
            curl -sSf -X PUT -H "Authorization: Bearer $TOKEN" --data-binary "@$f" "${UPLOAD_URL%/}/snapshot/$(basename "$f")"
          done
      - name: Upload release artifacts
        if: ${{ needs.release-please.outputs.release_created == 'true' && steps.check-uploader.outputs.available == 'true' }}
        env:
          UPLOAD_URL: ${{ secrets.ARTIFACT_UPLOADER_URL }}
        run: |
          TOKEN=$(curl -sSf  -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r '.value')
          for f in $(jq -r '.[] | select(.type=="Binary" or .type=="Linux Package") | .path' dist/artifacts.json); do
            curl -sSf -X PUT -H "Authorization: Bearer $TOKEN" --data-binary "@$f" "${UPLOAD_URL%/}/release/$(basename "$f")"
          done
